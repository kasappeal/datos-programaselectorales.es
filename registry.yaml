# Curated registry. Human-maintained, versioned.
#
# One entry per tracked document. `sources` may be empty while a party has not
# published yet; the collector skips those and the site shows "pending".
# Document ids must be unique across the whole registry (observations key on them).
#
# Party `color` is optional and curated (hex #rrggbb). It is an identification
# aid only, not an official brand value.
#
# Party `seats` is optional and curated: current members of the Congress of
# Deputies, used only to order parties on the site. Review it periodically.
# Seeded below with the 2023 general election result (XV legislature).

